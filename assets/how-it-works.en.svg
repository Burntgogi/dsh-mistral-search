<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img" aria-label="How a web search runs in DeepSeek Harness" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif">
<title>How a web search runs in DeepSeek Harness</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b8794"/></marker></defs>
<rect width="980" height="560" rx="12" fill="#ffffff"/>
<rect x="20" y="118" width="190" height="100" rx="8" fill="#f5f7fa" stroke="#7b8794"/>
<text x="115.0" y="144" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">Session model</text>
<text x="115.0" y="165" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">Calls web_search</text>
<text x="115.0" y="183" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">with 1 to 4 queries</text>
<rect x="270" y="118" width="190" height="100" rx="8" fill="#f5f7fa" stroke="#7b8794"/>
<text x="365.0" y="144" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">web_search tool</text>
<text x="365.0" y="165" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">DeepSeek Harness</text>
<text x="365.0" y="183" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">Runs queries at once</text>
<rect x="520" y="118" width="190" height="100" rx="8" fill="#f5f7fa" stroke="#7b8794"/>
<text x="615.0" y="144" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">dsh-mistral-search</text>
<text x="615.0" y="165" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">Sends one request</text>
<text x="615.0" y="183" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">per query</text>
<rect x="770" y="118" width="190" height="100" rx="8" fill="#f5f7fa" stroke="#7b8794"/>
<text x="865.0" y="144" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">Mistral API</text>
<text x="865.0" y="165" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">POST /v1/conversations</text>
<text x="865.0" y="183" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">mistral-small-latest runs</text>
<text x="865.0" y="201" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">the built-in web search</text>
<line x1="213" y1="168.0" x2="267" y2="168.0" stroke="#7b8794" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="463" y1="168.0" x2="517" y2="168.0" stroke="#7b8794" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="713" y1="168.0" x2="767" y2="168.0" stroke="#7b8794" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="270" y="20" width="440" height="62" rx="8" fill="#ffffff" stroke="#7b8794" stroke-dasharray="5 4"/>
<text x="490.0" y="45" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">Mistral key</text>
<text x="490.0" y="66" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="middle">Without it, the Harness hides web_search from the model</text>
<line x1="615" y1="84" x2="615" y2="115" stroke="#7b8794" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<rect x="420" y="256" width="380" height="60" rx="8" fill="#ffffff" stroke="#7b8794"/>
<rect x="420" y="256" width="7" height="60" rx="3" fill="#b7791f"/>
<text x="440" y="281" font-size="13.5" font-weight="600" fill="#1f2933" text-anchor="start">429, 5xx, network failure, timeout, tool skipped</text>
<text x="440" y="301" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="start">12 s per attempt, one more try, then an error</text>
<line x1="865.0" y1="286.0" x2="803" y2="286.0" stroke="#7b8794" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="420" y1="286.0" x2="365.0" y2="286.0" stroke="#7b8794" stroke-width="1.6"/>
<rect x="420" y="330" width="380" height="60" rx="8" fill="#ffffff" stroke="#7b8794"/>
<rect x="420" y="330" width="7" height="60" rx="3" fill="#c05621"/>
<text x="440" y="355" font-size="13.5" font-weight="600" fill="#1f2933" text-anchor="start">Safety filter block (HTTP 200)</text>
<text x="440" y="375" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="start">Tells the model the search was blocked, not empty</text>
<line x1="865.0" y1="360.0" x2="803" y2="360.0" stroke="#7b8794" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="420" y1="360.0" x2="365.0" y2="360.0" stroke="#7b8794" stroke-width="1.6"/>
<rect x="420" y="404" width="380" height="60" rx="8" fill="#ffffff" stroke="#7b8794"/>
<rect x="420" y="404" width="7" height="60" rx="3" fill="#2f855a"/>
<text x="440" y="429" font-size="13.5" font-weight="600" fill="#1f2933" text-anchor="start">Search results</text>
<text x="440" y="449" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="start">Returned as a list of sources</text>
<line x1="865.0" y1="434.0" x2="803" y2="434.0" stroke="#7b8794" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="420" y1="434.0" x2="365.0" y2="434.0" stroke="#7b8794" stroke-width="1.6"/>
<rect x="420" y="478" width="380" height="60" rx="8" fill="#ffffff" stroke="#7b8794"/>
<rect x="420" y="478" width="7" height="60" rx="3" fill="#c53030"/>
<text x="440" y="503" font-size="13.5" font-weight="600" fill="#1f2933" text-anchor="start">Rejected key, bad request</text>
<text x="440" y="523" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="start">Fails at once with Mistral's reason</text>
<line x1="865.0" y1="508.0" x2="803" y2="508.0" stroke="#7b8794" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="420" y1="508.0" x2="365.0" y2="508.0" stroke="#7b8794" stroke-width="1.6"/>
<line x1="865.0" y1="218" x2="865.0" y2="508.0" stroke="#7b8794" stroke-width="1.6"/>
<line x1="365.0" y1="508.0" x2="365.0" y2="221" stroke="#7b8794" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="355.0" y="244" font-size="12.5" font-weight="500" fill="#52606d" text-anchor="end">Result</text>
<line x1="615" y1="255" x2="615" y2="221" stroke="#7b8794" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="625" y="241" font-size="12.5" font-weight="500" fill="#52606d" text-anchor="start">Retry</text>
<line x1="325.0" y1="218" x2="325.0" y2="234" stroke="#7b8794" stroke-width="1.6"/>
<line x1="325.0" y1="234" x2="115.0" y2="234" stroke="#7b8794" stroke-width="1.6"/>
<line x1="115.0" y1="234" x2="115.0" y2="221" stroke="#7b8794" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="20" y="330" width="300" height="92" rx="8" fill="#f5f7fa"/>
<text x="36" y="360" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">The session model and the search model</text>
<text x="36" y="381" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">are separate. Whatever the session uses,</text>
<text x="36" y="402" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">mistral-small-latest runs the search.</text>
</svg>
